name: Image Builder

on:
  workflow_call:
    inputs:
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      feeds_conf:
        required: false
        type: string
        default: feeds.conf.default
      config_file:
        required: true
        type: string
        default: .config
      diy_p1_sh:
        required: false
        type: string
        default: diy-part1.sh
      diy_p2_sh:
        required: false
        type: string
        default: diy-part2.sh
      release_file:
        required: false
        type: string
        default: release.md
      upload_bin_dir:
        required: false
        type: boolean
        default: false
      upload_firmware:
        required: false
        type: boolean
        default: true
      upload_release:
        required: false
        type: boolean
        default: true
      tz:
        required: false
        type: string
        default: Asia/Shanghai
    outputs:
      repo_hash:
        value: ${{ jobs.build.outputs.repo_hash }}

env:
  REPO_URL: ${{ inputs.repo_url }}
  REPO_BRANCH: ${{ inputs.repo_branch }}
  FEEDS_CONF: ${{ inputs.feeds_conf }}
  CONFIG_FILE: ${{ inputs.config_file }}
  DIY_P1_SH: ${{ inputs.diy_p1_sh }}
  DIY_P2_SH: ${{ inputs.diy_p2_sh }}
  RELEASE_FILE: ${{ inputs.release_file }}
  UPLOAD_BIN_DIR: ${{ inputs.upload_bin_dir }}
  UPLOAD_FIRMWARE: ${{ inputs.upload_firmware }}
  UPLOAD_RELEASE: ${{ inputs.upload_release }}
  TZ: ${{ inputs.tz }}

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      repo_hash: ${{ steps.get-hash.outputs.repo_hash }}

    steps:
      - name: 📥 检出代码 - 获取当前工作流与仓库文件
        uses: actions/checkout@main

      - name: 🛠️ 初始化环境 - 配置系统并安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 📂 克隆源码 - 拉取指定的 OpenWrt 仓库代码
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 🧬 生成工具链哈希 - 用于区分缓存 Key
        working-directory: /workdir/openwrt
        run: |
          TOOLCHAIN_HASH=$(git log --pretty=tformat:'%h' -n1 tools toolchain || echo none)
          echo "当前工具链哈希: $TOOLCHAIN_HASH"
          echo "$TOOLCHAIN_HASH" > .toolchain.hash
          cat .toolchain.hash

      - name: ⚡ 编译缓存加速 - 恢复与保存工具链及编译缓存
        uses: xcz-ns/cachewrtbuild@main
        with:
          ccache: "true"
          prefix: "/workdir/openwrt"
          mixkey: "immortalwrt-cudy-tr3000"

      - name: 🏷️ 获取哈希值 - 记录 OpenWrt 源码提交版本
        id: get-hash
        run: echo "repo_hash=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: 🔌 加载自定义源 - 应用 feeds 配置并执行脚本一
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: 🔄 更新软件源 - 拉取最新的 feeds 列表
        run: cd openwrt && ./scripts/feeds update -a

      - name: 📦 安装软件源 - 安装 feeds 中的软件包
        run: cd openwrt && ./scripts/feeds install -a

      - name: ⚙️ 加载自定义配置 - 应用 config 选项并执行脚本二
        run: |
          if [ -d files ]; then
            mkdir -p openwrt/files
            cp -af files/. openwrt/files/
          fi
          [ -f "$CONFIG_FILE" ] && cp -f "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            echo "校验自定义根文件覆盖层..."
            diff -qr "$GITHUB_WORKSPACE/files" "$GITHUB_WORKSPACE/openwrt/files" || true

            echo "============================================="
            echo "🔍 对比仓库 files 和 openwrt/files 文件一致性"
            echo "============================================="
            # 生成两个目录的【相对路径】+sha清单，只比对同名文件
            TMP_SRC=$(mktemp)
            TMP_DST=$(mktemp)
            cd "$GITHUB_WORKSPACE/files"
            find . -type f -print0 | xargs -0 sha256sum | awk '{print $2,$1}' > "$TMP_SRC"
            cd "$GITHUB_WORKSPACE/openwrt/files"
            find . -type f -print0 | xargs -0 sha256sum | awk '{print $2,$1}' > "$TMP_DST"

            # 遍历源目录所有文件，在目标目录查找同名文件比对哈希
            while read -r relpath shasrc; do
              if grep -q "^$relpath " "$TMP_DST"; then
                shadst=$(grep "^$relpath " "$TMP_DST" | cut -d' ' -f2)
                if [ "$shasrc" = "$shadst" ]; then
                  echo "[✅ 一致] $relpath"
                else
                  echo "[❌ 不一致] $relpath"
                fi
              else
                echo "[⚠️ 目标不存在] $relpath"
              fi
            done < "$TMP_SRC"

            # 找出目标目录独有文件（脚本生成的 lucky / banner 这类）
            echo "---------------------------------------------"
            echo "[➕ 目标目录新增文件（脚本生成）]"
            while read -r relpath shadst; do
              if ! grep -q "^$relpath " "$TMP_SRC"; then
                echo "$relpath"
              fi
            done < "$TMP_DST"

            rm -f "$TMP_SRC" "$TMP_DST"
          fi
          
          echo "============================================="
          echo "📂 openwrt/files 完整目录结构"
          echo "============================================="
          if command -v tree >/dev/null 2>&1; then
            tree -L 9 "$GITHUB_WORKSPACE/openwrt/files"
          else
            echo "⚠️ 当前环境没有 tree 命令，使用 find 模拟树形输出"
            find "$GITHUB_WORKSPACE/openwrt/files" -print | sed -e 's;[^/]*/;|____;g;s;____|; |;g'
          fi

      - name: ⬇️ 下载依赖包 - 提前下载编译所需的所有源码包
        id: package
        run: |
          cd openwrt
          make defconfig
          grep -vE '^#|^$' .config
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 🔨 编译固件 - 开始多线程构建 OpenWrt 镜像
        id: compile
        run: |
          cd openwrt

          printf "%-10s %-6s %s\n" "大小" "类型" "目录/文件"
          printf "%-10s %-6s %s\n" "----------" "------" "----------------------------------------"

          {
            du -ah --max-depth=1 --exclude=build_dir --exclude=bin . 2>/dev/null
            du -ah --max-depth=1 ./build_dir 2>/dev/null
            du -ah --max-depth=1 ./bin 2>/dev/null
          } | awk '
          $2 != "." {
              name = $2
              # 快速判断是否为目录
              if (system("test -d \"" name "\"") == 0) {
                  flag = "0"
                  label = "[DIR]"
              } else {
                  flag = "1"
                  label = "[FILE]"
              }
              print flag "|" $1 "|" label "|" name
          }
          ' | sort -t'|' -k1,1n -k2,2hr | awk -F'|' '{printf "%-10s %-6s %s\n", $2, $3, $4}'
          
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV || echo "DEVICE_NAME=unknown" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          
          echo "============================================="
          echo "📊 编译完成，开始读取 ccache 缓存统计信息"
          echo "============================================="
          export CCACHE_DIR=$GITHUB_WORKSPACE/openwrt/.ccache
          ccache -s
          CACHE_RATE=$(ccache -s | grep "cache hit rate" | awk '{print $4}')
          echo ""
          echo "🔥 当前本次编译综合缓存命中率：${CACHE_RATE}"
          echo "---------------------------------------------"
          echo "ℹ️ 说明："
          echo "✅ cache hit：缓存命中，无需真实编译，直接复用目标文件"
          echo "❌ cache miss：缓存未命中，需要完整执行源码编译"
          echo "📈 cache hit rate：综合缓存命中率，越高编译速度越快"
          echo "💡 若命中率偏低，可检查 toolchain、feeds、config 是否发生变更"
          echo "============================================="

      - name: 💾 检查空间占用 - 打印当前系统磁盘使用情况
        if: (!cancelled())
        run: df -hT

      - name: 📤 上传 Bin 目录 - 将编译生成的完整 bin 文件夹保存至 Artifacts
        uses: actions/upload-artifact@main
        if: steps.compile.conclusion == 'success' && env.UPLOAD_BIN_DIR == 'true' && !cancelled()
        with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: 🗂️ 整理输出文件 - 提取并打包目标固件目录
        id: organize
        if: steps.compile.conclusion == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          tar -zcf packages.tar.gz packages
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: 🚀 上传固件目录 - 将最终精简的固件文件保存至 Artifacts
        uses: actions/upload-artifact@main
        if: steps.organize.conclusion == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 🔖 生成 Release 说明 - 汇总已启用的 LuCI 应用与主题
        id: tag
        if: steps.compile.conclusion == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          cd openwrt

          {
            echo "# Cudy TR3000 ImmortalWrt 固件"
            echo
            echo "## 构建信息"
            echo
            echo "- **构建时间**：$(date +"%Y-%m-%d %H:%M %Z")"
            echo "- **目标设备**：${DEVICE_NAME}"
            echo "- **上游源码**：${REPO_URL}（分支：${REPO_BRANCH}）"
            echo "- **上游提交**：$(git rev-parse HEAD)"
            echo "- **工作流运行**：[查看构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "## 已启用的 LuCI 应用与主题"
            echo
            echo "下表根据编译完成后的 \`.config\` 自动生成；“源码地址”是该包所在 Git 仓库的 \`origin\` 地址。"
            echo
            echo "| 软件包 | 类别 | 源码地址 | 源码版本 | 源码目录 |"
            echo "| --- | --- | --- | --- | --- |"

            mapfile -t luci_packages < <(grep -E '^CONFIG_PACKAGE_luci-(app|theme)-[A-Za-z0-9-]+=y$' .config | sed -E 's/^CONFIG_PACKAGE_(.*)=y$/\1/' | sort -u || true)

            if [ "${#luci_packages[@]}" -eq 0 ]; then
              echo "| 未检测到 | - | - | - | - |"
            else
              for package in "${luci_packages[@]}"; do
                if [[ "$package" == luci-app-* ]]; then
                  category="LuCI 应用"
                else
                  category="LuCI 主题"
                fi

                package_makefile=$(find feeds package -type f -path "*/${package}/Makefile" -print -quit)
                if [ -n "$package_makefile" ]; then
                  package_dir=$(dirname "$package_makefile")
                  source_url=$(git -C "$package_dir" remote get-url origin 2>/dev/null || true)
                  source_commit=$(git -C "$package_dir" rev-parse --short HEAD 2>/dev/null || true)
                  if [ -n "$source_url" ]; then
                    source_url=${source_url%.git}
                    source_url=$(sed -E 's#^git@github\.com:#https://github.com/#' <<< "$source_url")
                    source_url="[仓库](${source_url})"
                  else
                    source_url="随上游源码提供"
                  fi
                  [ -n "$source_commit" ] || source_commit="未知"
                  source_dir=${package_dir#./}
                else
                  source_url="未定位到 Makefile"
                  source_commit="-"
                  source_dir="-"
                fi

                echo "| \`${package}\` | ${category} | ${source_url} | \`${source_commit}\` | \`${source_dir}\` |"
              done
            fi
          } > "$GITHUB_WORKSPACE/$RELEASE_FILE"

      - name: 🎉 发布最终固件 - 将编译成果上传至 GitHub Releases
        uses: softprops/action-gh-release@master
        if: steps.tag.conclusion == 'success' && steps.organize.conclusion == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: ${{ env.RELEASE_FILE }}
          files: ${{ env.FIRMWARE }}/*

  cleanup:
    if: success()
    uses: ./.github/workflows/clean-up.yml
    needs: build
    with:
      clean-release: true
